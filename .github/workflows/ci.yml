name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-only-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest==8.4.2
          bcrypt==5.0.0
          chromadb==1.5.9
          fastapi==0.165.0
          google-genai==3.6.1
          python-dotenv==1.2.4
          python-jose[cryptography]==3.5.0
          rank-bm25==0.2.2

      - name: Run backend tests
        run: pytest backend/tests
